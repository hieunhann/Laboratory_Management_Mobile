workflows:
  ios-sideload-workflow:
    name: iOS Build for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS unsigned
        script: flutter build ios --release --no-codesign
      - name: Package IPA for Sideloadly
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r -q App.ipa Payload
    artifacts:
      - build/ios/iphoneos/App.ipa

  android-apk-workflow:
    name: Android APK Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: default
      java: 17
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Patch flutter_inappwebview_android for AGP 8+
        script: |
          find ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android*/android -name "build.gradle" -exec sed -i '' 's/proguard-android.txt/proguard-android-optimize.txt/g' {} + || true
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
