workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          flutter packages pub get
      - name: Build iOS unsigned IPA
        script: |
          # Build Flutter iOS project without code signing
          flutter build ios --release --no-codesign
          
          # Create Payload directory and move the built .app inside it
          mkdir -p build/ios/iphoneos/Payload
          # Copy the .app into Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          
          # Zip it to create the .ipa file
          cd build/ios/iphoneos
          zip -qr app.ipa Payload
    artifacts:
      - build/ios/iphoneos/app.ipa
